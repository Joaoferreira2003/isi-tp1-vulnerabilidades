# Carrega automaticamente os dashboards da pasta grafana/dashboards/
apiVersion: 1

providers:
  - name: 'TP1 ISI'
    orgId: 1
    folder: 'TP1 ISI'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
